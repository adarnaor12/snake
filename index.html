<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>🐍 סנייק</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #16213e 0%, #0a0e1a 70%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Heebo", sans-serif;
    color: #e8eefc;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    gap: 12px;
  }
  header {
    padding-top: 14px;
    text-align: center;
    flex-shrink: 0;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .scores {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    gap: 10px;
  }
  .score-box {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 8px 4px;
  }
  .score-box .label { font-size: 11px; opacity: 0.55; font-weight: 600; }
  .score-box .val { font-size: 22px; font-weight: 800; color: #4ade80; }
  #best .val { color: #fbbf24; }
  .board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  #board {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(74,222,128,0.18);
    border-radius: 18px;
    box-shadow: 0 0 50px rgba(34,211,238,0.08), inset 0 0 30px rgba(0,0,0,0.5);
    touch-action: none;
  }
  .hint {
    text-align: center;
    font-size: 13px;
    opacity: 0.45;
    flex-shrink: 0;
    padding-bottom: 6px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,14,26,0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    z-index: 10;
    transition: opacity 0.25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { font-size: 34px; font-weight: 800; }
  .overlay p { font-size: 16px; opacity: 0.7; max-width: 260px; line-height: 1.5; }
  .big-emoji { font-size: 64px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  button.play {
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    color: #06121f;
    border: none;
    font-size: 19px;
    font-weight: 800;
    padding: 15px 44px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(34,211,238,0.35);
    transition: transform 0.1s;
  }
  button.play:active { transform: scale(0.94); }
  .final-score { font-size: 20px; color: #fbbf24; font-weight: 700; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐍 SNAKE</h1>
    <div class="scores">
      <div class="score-box" id="cur"><div class="label">ניקוד</div><div class="val">0</div></div>
      <div class="score-box" id="best"><div class="label">שיא</div><div class="val">0</div></div>
    </div>
  </header>
  <div class="board-wrap">
    <canvas id="board"></canvas>
  </div>
  <div class="hint">החלק עם האצבע כדי לכוון 👆</div>

  <div class="overlay" id="overlay">
    <div class="big-emoji" id="emoji">🐍</div>
    <h2 id="ovTitle">מוכן לשחק, נחל לין?</h2>
    <p id="ovText">החלק למעלה / למטה / ימינה / שמאלה כדי להזיז את הנחש. אכל את 🍎 כדי לגדול. אל תתנגש בעצמך!</p>
    <div class="final-score" id="finalScore"></div>
    <button class="play" id="playBtn">התחל</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const curEl = document.querySelector('#cur .val');
  const bestEl = document.querySelector('#best .val');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const emoji = document.getElementById('emoji');
  const finalScore = document.getElementById('finalScore');
  const playBtn = document.getElementById('playBtn');

  const GRID = 17;          // cells per side
  let cell = 20;            // pixel size of a cell (set on resize)
  let snake, dir, nextDir, food, score, best, alive, speed, lastTick, raf;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  best = parseInt(lsGet('snakeBest') || '0', 10);
  bestEl.textContent = best;

  function fit() {
    const wrap = canvas.parentElement;
    const size = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight));
    cell = Math.floor(size / GRID);
    const px = cell * GRID;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = px + 'px';
    canvas.style.height = px + 'px';
    canvas.width = px * dpr;
    canvas.height = px * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function reset() {
    snake = [{x: 8, y: 8}, {x: 7, y: 8}, {x: 6, y: 8}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 160;
    alive = true;
    placeFood();
    curEl.textContent = '0';
    lastTick = 0;
  }

  function placeFood() {
    while (true) {
      const f = {x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0};
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      curEl.textContent = score;
      if (speed > 70) speed -= 4;
      placeFood();
      buzz(12);
    } else {
      snake.pop();
    }
  }

  function rounded(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const px = cell * GRID;
    ctx.clearRect(0, 0, px, px);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, px); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(px, i * cell); ctx.stroke();
    }

    if (!snake) return;

    // food
    const fx = food.x * cell, fy = food.y * cell;
    ctx.fillStyle = '#ef4444';
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 14;
    rounded(fx + cell * 0.18, fy + cell * 0.18, cell * 0.64, cell * 0.64, cell * 0.32);
    ctx.fill();
    ctx.shadowBlur = 0;

    // snake
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const t = 1 - i / (n + 4);
      const g = Math.round(180 + 40 * t);
      ctx.fillStyle = i === 0 ? '#a7f3d0' : `rgb(34, ${g}, 130)`;
      if (i === 0) { ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 16; }
      rounded(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2, cell * 0.32);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // eyes on head
    const h = snake[0];
    ctx.fillStyle = '#06121f';
    const ex = h.x * cell, ey = h.y * cell;
    const e = cell * 0.13;
    const off = cell * 0.28;
    let e1, e2;
    if (dir.x === 1) { e1 = [off*2.4, off]; e2 = [off*2.4, cell-off]; }
    else if (dir.x === -1) { e1 = [cell-off*2.4, off]; e2 = [cell-off*2.4, cell-off]; }
    else if (dir.y === 1) { e1 = [off, off*2.4]; e2 = [cell-off, off*2.4]; }
    else { e1 = [off, cell-off*2.4]; e2 = [cell-off, cell-off*2.4]; }
    ctx.beginPath(); ctx.arc(ex+e1[0], ey+e1[1], e, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+e2[0], ey+e2[1], e, 0, 7); ctx.fill();
  }

  function loop(ts) {
    if (!alive) return;
    if (ts - lastTick >= speed) { lastTick = ts; step(); draw(); }
    if (alive) raf = requestAnimationFrame(loop);
  }

  function start() {
    cancelAnimationFrame(raf);
    reset();
    overlay.classList.add('hidden');
    raf = requestAnimationFrame(loop);
  }

  function gameOver() {
    alive = false;
    buzz([30, 40, 30]);
    if (score > best) {
      best = score;
      lsSet('snakeBest', best);
      bestEl.textContent = best;
    }
    emoji.textContent = score > 0 ? '🎉' : '💀';
    ovTitle.textContent = 'נגמר, נחל לין!';
    ovText.textContent = score >= 15 ? 'וואו, אלוף! 🔥' : 'נסה שוב, אתה יכול יותר 💪';
    finalScore.textContent = 'ניקוד: ' + score + (score === best && score > 0 ? '  •  שיא חדש! 🏆' : '');
    overlay.classList.remove('hidden');
  }

  function setDir(x, y) {
    if (!alive) return;
    if (x === -dir.x && y === -dir.y) return; // no 180°
    if (x === dir.x && y === dir.y) return;
    nextDir = {x, y};
  }

  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

  // ---- swipe controls ----
  let tsx = 0, tsy = 0;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0]; tsx = t.clientX; tsy = t.clientY;
  }, {passive: true});
  canvas.addEventListener('touchmove', e => {
    if (!tsx) return;
    const t = e.touches[0];
    const dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    tsx = 0;
  }, {passive: true});

  // ---- keyboard (for testing on desktop) ----
  window.addEventListener('keydown', e => {
    const m = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
    if (m[e.key]) { e.preventDefault(); setDir(m[e.key][0], m[e.key][1]); }
  });

  playBtn.addEventListener('click', start);
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
